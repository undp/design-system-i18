  main:
    example: >
      <h2>Earth Hour 2025 เสาร์ที่ 22 มี.ค. ชวนปิดไฟ 1 ชั่วโมง ลดโลกร้อน</h2>
      <p>กทม. ชวนคนกรุงร่วมแสดงพลังและลดใช้พลังงาน ปิดไฟ 1 ชั่วโมง เพื่อลดโลกร้อน ในเวลา 2 ทุ่มครึ่ง ถึง 3 ทุ่มครึ่ง เสาร์ที่ 22 มี.ค. 68 พร้อมปักหมุดปิดไฟเชิงสัญลักษณ์ 5 แลนด์มาร์กกรุงเทพฯ</p>
      <p>วันที่ 21 มี.ค. 68 นายเอกวรัญญู อัมระปาล โฆษกของกรุงเทพมหานคร เผยถึงกิจกรรม 60+ Earth Hour 2025: ปิดไฟ 1 ชั่วโมง เพื่อลดโลกร้อนว่า สำหรับปี 2568 กรุงเทพมหานคร ร่วมกับภาคีเครือข่าย ยังคงเดินหน้ารณรงค์กิจกรรมปิดไฟ 1 ชั่วโมง เพื่อลดโลกร้อน ซึ่งปีนี้กำหนดจัดกิจกรรมในวันเสาร์ที่ 22 มีนาคม 2568 เวลา 20.30 – 21.30 น. ด้วยการขอความร่วมมือจากภาคีเครือข่ายทั้งองค์กรภาครัฐ เอกชน ผู้ประกอบการ ร้านค้า และประชาชน รวมทั้งสื่อมวลชนทุกแขนง ลดการใช้พลังงานและปิดไฟที่ไม่จำเป็น เช่น ไฟประดับ ไฟอาคาร ตึกสูง ป้ายโฆษณา ไฟบ้านเรือน และการถอดปลั๊กเครื่องใช้ไฟฟ้าที่ไม่ใช้งาน ลดการใช้เครื่องปรับอากาศในอาคารบ้านเรือน เป็นเวลา 1 ชั่วโมง โดยเชิญชวนร่วมแชร์การมีส่วนร่วมกิจกรรมในโซเชียลมีเดีย ด้วยการติดแฮชแท็ก คำว่า #EarthHour2025 หรือ #BiggestHourForEarth หรือ #MyHourForEarth</p>
    title: ตรวจสอบแบบอักษร
    h2: หัวข้อระดับสอง
    h3: หัวข้อระดับสาม
    h4: หัวข้อระดับสี่
    h5: หัวข้อระดับห้า
    h6: หัวข้อระดับหก
    paragraph1: |
      นี่คือ <strong>ข้อความตัวหนา</strong>,<br> และนี่คือ <b>ข้อความตัวหนาโดยใช้แท็ก &lt;b&gt;</b>.<br>
      นี่คือ <em>ข้อความตัวเอียง</em>,<br> และนี่คือ <i>ข้อความตัวเอียงโดยใช้แท็ก &lt;i&gt;</i>.<br>
      ข้อความนี้ <u>ขีดเส้นใต้</u> โดยใช้แท็ก &lt;u&gt;.

    paragraph2: |
      <small>นี่คือข้อความขนาดเล็กโดยใช้แท็ก &lt;small&gt;</small><br>
      นี่คือข้อความปกติพร้อม <sub>ตัวห้อย</sub> และ <sup>ตัวห้อยบน</sup>.<br>
      นี่คือ <mark>ข้อความที่เน้น</mark> โดยใช้แท็ก &lt;mark&gt;.<br>
      <del>ข้อความนี้ถูกลบ</del> โดยใช้แท็ก &lt;del&gt;,<br> และนี่คือ <ins>ขีดเส้นใต้</ins> โดยใช้แท็ก &lt;ins&gt;.

    paragraph3: |
      แสดงข้อความจากขวาไปซ้าย: <bdo dir="rtl">ข้อความที่เขียนจากขวาไปซ้าย</bdo><br>
      แสดงข้อความจากซ้ายไปขวา: <bdo dir="ltr">ข้อความที่เขียนจากซ้ายไปขวา</bdo>

    paragraph4: |
      คุณสามารถแสดงโค้ดแบบนี้: <code>let x = 10;</code>.

    paragraph5: |
      ข้อความนี้แสดง
                      พร้อมช่องว่างที่เก็บไว้และ
                      บรรทัดใหม่.

    paragraph6: |
      <blockquote class="paragraph">
          <p>
            นี่คือคำพูดที่มักใช้เพื่อเน้นข้อความหรือคำพูดที่สำคัญ.
          </p>
      </blockquote>
      <p class="paragraph">
          คำพูดสั้น: <q>นี่คือคำพูดสั้น.</q>
      </p>
      <p class="paragraph">
          ข้อความนี้เป็นตัวย่อ: <abbr title="Cascading Style Sheets">UNDP</abbr>.
      </p>
      <p class="paragraph">
          ข้อความที่แสดงถึงการอ้างอิง: <cite>คำพูดนี้มาจากหนังสือ "1984".</cite>
      </p>
      <p class="paragraph">
          การป้อนข้อมูลจากแป้นพิมพ์: <kbd>Ctrl + C</kbd>.<br>
          ผลลัพธ์ของโปรแกรม: <samp>Error 404</samp>.<br>
          <var>x</var> + <var>y</var> = <var>z</var> (ตัวแปรในโปรแกรม).
      </p>
      <ul>
          <li>รายการแรก</li>
          <li>รายการที่สอง</li>
          <li>รายการที่สาม</li>
      </ul>
      <p class="paragraph">
          ป้ายกำกับสำหรับองค์ประกอบฟอร์ม: <label for="input">กรอกชื่อของคุณ:</label><br>
          <input type="text" id="input" placeholder="ชื่อของคุณ">
      </p>
      <p class="paragraph">
          ปุ่มการกระทำ: <button>คลิกที่นี่</button>.
      </p>

    paragraph7: |
      <section>
          <article>
              <h6 class="heading">บทความ</h6>
              <p>นี่คือบล็อกเนื้อหาแบบสแตนด์อโลน.</p>
          </article>
          <aside>
              <p>ข้อความนี้เป็นเนื้อหาด้านข้าง.</p>
          </aside>
      </section>

    paragraph8: |
